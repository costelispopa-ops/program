<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Program SportGuru</title>
<meta name="theme-color" content="#4B0080">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Program SG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#4B0080}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F5F3F9;
         padding-top:env(safe-area-inset-top);box-sizing:border-box}
  .fallback{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
         text-align:center;font:14px system-ui,sans-serif;color:#fff;background:#4B0080}
  .fallback a{color:#fff}
</style>
</head>
<body>
<!-- Înlocuiește https://script.google.com/macros/s/AKfycbwKPGaL8yz8LyWAFVNhboyuYGKsbctNLVQfRYKBBBAR6WzPw0NJ3We82ewOD5OzTbZ7/exec cu linkul /exec al aplicației Program de lucru -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbwKPGaL8yz8LyWAFVNhboyuYGKsbctNLVQfRYKBBBAR6WzPw0NJ3We82ewOD5OzTbZ7/exec" title="Program de lucru SportGuru Iași" allow="clipboard-write"></iframe>
<div class="fallback" id="fb" hidden>Programul nu s-a încărcat. <a href="https://script.google.com/macros/s/AKfycbwKPGaL8yz8LyWAFVNhboyuYGKsbctNLVQfRYKBBBAR6WzPw0NJ3We82ewOD5OzTbZ7/exec" target="_top">Deschide-l direct</a></div>
<script>
  // dacă iframe-ul nu se încarcă în 12 secunde, arată linkul direct
  var ok=false; document.getElementById('app').addEventListener('load',function(){ok=true;});
  setTimeout(function(){ if(!ok) document.getElementById('fb').hidden=false; },12000);
</script>
</body>
</html>
